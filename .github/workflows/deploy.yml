name: Deploy Site
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      TRUSTED_INGEST: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      NuGetReportSettings_Endpoint: ${{ env.TRUSTED_INGEST == 'true' && secrets.NUGETREPORTSETTINGS_ENDPOINT || '' }}
      NuGetReportSettings_RuleId: ${{ env.TRUSTED_INGEST == 'true' && secrets.NUGETREPORTSETTINGS_RULEID || '' }}
    steps:
      - name: Get the sources
        uses: actions/checkout@v7

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet run --project ./src/DevLead -- deploy
        env:
          DEVLEADSE_GITHUB_TOKEN: ${{ secrets.DEVLEADSE_GITHUB_TOKEN }}

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Azure login
        if: ${{ env.TRUSTED_INGEST == 'true' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run DPI Analyze
        if: ${{ env.NuGetReportSettings_Endpoint == '' || env.NuGetReportSettings_RuleId == '' }}
        shell: bash
        run: dotnet dpi nuget --silent --output table analyze --buildversion $GITHUB_RUN_NUMBER

      - name: Run DPI Report
        if: ${{ env.NuGetReportSettings_Endpoint != '' && env.NuGetReportSettings_RuleId != '' }}
        shell: bash
        run: dotnet dpi nuget --silent --output table report --buildversion $GITHUB_RUN_NUMBER
